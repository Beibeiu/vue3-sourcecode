<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { reactive, effect } from "./reactivity.js";

      let obj = { name: "Bei", age: 18 };
      const obj1 = reactive(obj);
      const obj2 = reactive(obj1);

      console.log(obj1.name);

      // 1. obj1 是一个 Proxy 对象
      // 2. 访问 obj1[ReactiveFlags.IS_REACTIVE] 会触发 get 陷阱
      // 3. get 陷阱返回 true （第 30 行）
      // 4. 条件成立，直接返回 target （也就是 obj1 本身）
      // 实现了对 obj1 的重复调用，返回的是同一个对象
      console.log(obj1 === obj2);
    </script>
  </body>
</html>
